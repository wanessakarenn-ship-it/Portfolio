    <script>
        tailwind.config = {
            theme: {
                extend: {
                    // Cor de fundo Neumorphism: #FDFBF7
                    colors: {
                        'neum-base': '#FDFBF7',
                        'primary-accent': '#E07A5F', // Cor original de destaque
                        'secondary-accent': '#81B29A', // Cor original da timeline
                        'text-dark': '#3D405B', // Cor original do texto
                    },
                    // Sombra Neumorphism
                    boxShadow: {
                        // Sombra de relevo (Convex) - Parece que está "saindo"
                        'neum-convex': '8px 8px 16px #D9D7D3, -8px -8px 16px #FFFFFF',
                        // Sombra de "afundar" (Concave) - Para botões pressionados ou inputs
                        'neum-concave': 'inset 5px 5px 10px #D9D7D3, inset -5px -5px 10px #FFFFFF',
                        // Sombra sutil para itens menores
                        'neum-soft': '3px 3px 6px #D9D7D3, -3px -3px 6px #FFFFFF',
                    },
                }
            }
        }
    </script>

        .chart-container {
            position: relative;
            width: 100%;

            border-radius: 1.5rem; /* Bordas mais arredondadas */
            padding: 1.5rem;
        }

        @media (min-width: 768px) {
            .chart-container {
                height: 400px;
            }
        }
